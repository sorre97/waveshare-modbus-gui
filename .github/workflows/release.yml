name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Derive version tag ──────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate tag
        id: tag
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "tag=v0.1.${COUNT}" >> "$GITHUB_OUTPUT"

  # ── macOS build → .dmg ──────────────────────────────────────────────────────
  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: GUI
        run: flutter pub get

      - name: Build macOS release
        working-directory: GUI
        run: flutter build macos --release

      - name: Ad-hoc code sign
        run: |
          RELEASE_DIR="GUI/build/macos/Build/Products/Release"
          APP_PATH=$(find "$RELEASE_DIR" -maxdepth 1 -name "*.app" | head -1)
          echo "Signing: $APP_PATH"
          codesign --deep --force --sign - "$APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create .dmg
        run: |
          # Find the actual .app (name comes from PRODUCT_NAME in xcconfig)
          RELEASE_DIR="GUI/build/macos/Build/Products/Release"
          APP_PATH=$(find "$RELEASE_DIR" -maxdepth 1 -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH")
          echo "Found app: $APP_PATH"
          create-dmg \
            --volname "RelayCtrl Pro" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "$APP_NAME" 180 170 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            "RelayCtrlPro-macOS.dmg" \
            "$APP_PATH"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayCtrlPro-macOS
          path: RelayCtrlPro-macOS.dmg

  # ── Linux build → AppImage ───────────────────────────────────────────────────
  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libglib2.0-bin \
            fuse libfuse2 desktop-file-utils

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        working-directory: GUI
        run: flutter pub get

      - name: Build Linux release
        working-directory: GUI
        run: flutter build linux --release

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Assemble AppDir
        run: |
          BUNDLE=GUI/build/linux/x64/release/bundle
          APPDIR=AppDir

          mkdir -p $APPDIR/usr/bin
          mkdir -p $APPDIR/usr/lib
          mkdir -p $APPDIR/usr/share/icons/hicolor/256x256/apps
          mkdir -p $APPDIR/usr/share/applications

          # Copy binary and data
          cp -r $BUNDLE/* $APPDIR/usr/bin/

          # Icon (256px)
          cp GUI/linux/runner/icons/icon_256.png \
            $APPDIR/usr/share/icons/hicolor/256x256/apps/relayctrl-pro.png
          cp GUI/linux/runner/icons/icon_256.png $APPDIR/relayctrl-pro.png

          # Desktop entry
          cat > $APPDIR/usr/share/applications/relayctrl-pro.desktop << 'EOF'
          [Desktop Entry]
          Name=RelayCtrl Pro
          Exec=relayctrl-pro
          Icon=relayctrl-pro
          Type=Application
          Categories=Utility;
          EOF

          cp $APPDIR/usr/share/applications/relayctrl-pro.desktop $APPDIR/

          # AppRun
          cat > $APPDIR/AppRun << 'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/relayctrl-pro" "$@"
          APPRUN
          chmod +x $APPDIR/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 appimagetool --no-appstream AppDir RelayCtrlPro-Linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayCtrlPro-Linux
          path: RelayCtrlPro-Linux-x86_64.AppImage

  # ── Windows build → portable zip ────────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        working-directory: GUI
        run: flutter pub get

      - name: Build Windows release
        working-directory: GUI
        run: flutter build windows --release

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $src = "GUI\build\windows\x64\runner\Release"
          $dst = "RelayCtrlPro-Windows-x64-Portable"
          New-Item -ItemType Directory -Path $dst | Out-Null
          Copy-Item "$src\*" $dst -Recurse
          Compress-Archive -Path $dst -DestinationPath RelayCtrlPro-Windows-x64-Portable.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayCtrlPro-Windows
          path: RelayCtrlPro-Windows-x64-Portable.zip

  # ── Backend zip ──────────────────────────────────────────────────────────────
  build-backend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Backend as zip
        run: |
          zip -r RelayCtrlPro-Backend.zip Backend/ \
            --exclude "Backend/venv/*" \
            --exclude "Backend/__pycache__/*" \
            --exclude "Backend/*.pyc"

      - name: Upload Backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayCtrlPro-Backend
          path: RelayCtrlPro-Backend.zip

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    needs: [version, build-macos, build-linux, build-windows, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "RelayCtrl Pro ${{ needs.version.outputs.tag }}"
          body: |
            ## RelayCtrl Pro — Automated Release

            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | macOS | `RelayCtrlPro-macOS.dmg` | See macOS note below |
            | Linux x64 | `RelayCtrlPro-Linux-x86_64.AppImage` | `chmod +x` then run — no install needed |
            | Windows x64 | `RelayCtrlPro-Windows-x64-Portable.zip` | Extract folder, run `relayctrl-pro.exe` — no install needed |
            | Backend | `RelayCtrlPro-Backend.zip` | Python FastAPI hub |

            ### Backend quick start
            ```bash
            cd Backend
            python3 -m venv venv && source venv/bin/activate
            pip install fastapi uvicorn websockets wsproto

            # Default (connects to board at 192.180.100.21:4196)
            python main.py

            # Custom board IP / port
            python main.py --modbus-ip 192.168.1.50 --modbus-port 4196

            # All flags:
            #   --modbus-ip       Relay board IP        (default: 192.180.100.21)
            #   --modbus-port     Relay board TCP port  (default: 4196)
            #   --device-address  Modbus address        (default: 0x01)
            #   --host            Hub bind address      (default: 0.0.0.0)
            #   --port            Hub WebSocket port    (default: 8192)
            ```

            > Edit defaults at the top of `main.py` to make them permanent.

            ### macOS Gatekeeper
            The app is ad-hoc signed but not notarized (no Apple Developer ID). After dragging to Applications, run once:
            ```bash
            xattr -cr "/Applications/RelayCtrl Pro.app"
            ```
            Then open normally. This removes the quarantine flag macOS sets on downloaded files.
          draft: false
          prerelease: false
          files: |
            artifacts/RelayCtrlPro-macOS/RelayCtrlPro-macOS.dmg
            artifacts/RelayCtrlPro-Linux/RelayCtrlPro-Linux-x86_64.AppImage
            artifacts/RelayCtrlPro-Windows/RelayCtrlPro-Windows-x64-Portable.zip
            artifacts/RelayCtrlPro-Backend/RelayCtrlPro-Backend.zip
